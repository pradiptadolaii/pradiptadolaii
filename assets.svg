    <path class="ecg" d="M0 205 H250 l12 0 l10 -26 l14 58 l14 -86 l14 86 l10 -32 l12 0 H520 l12 0 l10 -26 l14 58 l14 -86 l14 86 l10 -32 l12 0 H900"
          fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    <g class="fade">
      <text x="60" y="108" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="700" fill="#ffffff" letter-spacing="-1">Pradipta Dolai</text>
      <text x="62" y="146" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="url(#accent)">Biomedical Engineer · AI for Healthcare</text>
      <text x="62" y="172" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8b949e">Biosensors  ·  Medical Imaging  ·  Medical Data Analytics</text>
