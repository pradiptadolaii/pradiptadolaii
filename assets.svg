<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0f2e36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#00B8A9"/>
      <stop offset="1" stop-color="#4f9cf9"/>
    </linearGradient>
    <clipPath id="c"><rect width="900" height="260" rx="20"/></clipPath>
    <style>
      .ecg { stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: draw 4s linear infinite; }
      @keyframes draw { 0% {stroke-dashoffset: 1400;} 70% {stroke-dashoffset: 0;} 100% {stroke-dashoffset: 0; opacity: 0;} }
      .fade { animation: fade 1.2s ease-out both; }
      @keyframes fade { from {opacity: 0; transform: translateY(8px);} to {opacity: 1; transform: none;} }
    </style>
  </defs>
  <g clip-path="url(#c)">
